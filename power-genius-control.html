<script type="text/markdown" data-help-name="power-genius-control">
Controls the Power Genius XL.

### Input

: topic (string) : `operate`, `antenna` or `command`. Only used when the node's Action is set to `msg.topic`; a fixed action in the node always takes precedence.

: payload (boolean|number|string) : Depends on the action:

| Action | Payload | Command sent |
|---|---|---|
| `operate` | `true`, `1`, `"1"` or `"on"` for operate, `false`, `0`, `"0"` or `"off"` for standby. Anything else is an error and nothing is sent. | `operate=<1\|0>` |
| `antenna` | The antenna number, 1-3. Only for amplifiers with the antenna switch; the SO2R version answers with an error | `antenna=<n>` |
| `command` | The command, on a single line, for example `setup read` or `ping` | The payload as it is |

### Output

: topic (string) : The action.
: payload (string) : The reply message from the amplifier, for example `key=value key=value ...`. Empty when the command has no reply message.

A failed command is reported as an error on the node, with the result code from the amplifier. For example
`0x50000015` means that the amplifier does not know the command, and `0x50000013` that the hardware has no antenna switch.

### Details

`command` is for trying out commands that the API documentation does not cover. Commands that change the
configuration, such as `ifconf`, `catradio` and `flexradio`, take effect after `save`, which reboots the amplifier. Use with care.
The effect of `operate` shows up in the status `state` (`STANDBY`, or `IDLE` when operating).
</script>
