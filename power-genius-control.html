<script type="text/html" data-template-name="power-genius-control">

<script type="text/markdown" data-help-name="power-genius-control">
Controls the Power Genius XL.

### Input

: topic (string) : `operate`. Only used when the node's Action is set to `msg.topic`; a fixed action in the node always takes precedence.

: payload (boolean|number|string) : `true`, `1`, `"1"` or `"on"` for 1, and `false`, `0`, `"0"` or `"off"` for 0. Anything else is an error and nothing is sent.

| Action | Command sent | 0 | 1 |
|---|---|---|---|
| `operate` | `operate=<0\|1>` | Standby | Operate |

A failed command is reported as an error on the node. The effect shows up in the status `state`
(`STANDBY`, or `IDLE` when operating).
</script>
