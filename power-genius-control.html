<script type="text/markdown" data-help-name="power-genius-control">
Sends commands to the Power Genius XL.

### Input

: topic (string) : `command` or `save`. Only used when the node's Action is set to `msg.topic`; a fixed action in the node always takes precedence.

: payload (string) : Depends on the action:

| Action | Payload | Effect |
|---|---|---|
| `command` | The command to send, for example `setup read` | Sends the command as it is and outputs the reply |
| `save` | ignored | Saves the configuration. **The amplifier reboots.** |

### Output

: topic (string) : The action.
: payload (string) : The reply message from the amplifier, for example `key=value key=value ...`.

A failed command is reported as an error on the node.

### Details

The API documentation only describes configuration commands, so `command` is the way to send anything else.
Setting commands such as `ifconf`, `catradio` and `flexradio` change the amplifier's configuration and take
effect after `save`.
</script>
