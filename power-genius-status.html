<script type="text/javascript">
    RED.nodes.registerType("power-genius-status", {
        category: "Power Genius",
        color: "#a6bbcf",
        defaults: {
            name: { value: "" },
            server: { type: "power-genius-server", required: true },
            property: { value: "*" },
            onlyChange: { value: true },
            deadband: { value: 0, validate: function (v) { return v === "" || v === undefined || (!isNaN(v) && Number(v) >= 0); } },
            startDelay: { value: 1000, validate: function (v) { return v === "" || v === undefined || (!isNaN(v) && Number(v) >= 0); } },
        },
        inputs: 1,
        outputs: 1,
        icon: "bridge.svg",
        label: function () {
            if (this.name) return this.name;
            return this.property && this.property !== "*" ? "pg " + this.property : "pg status";
        },
        oneditprepare: function () {
            const select = $("#node-input-property-select");
            const input = $("#node-input-property");
            const known = select.find("option").map(function () { return this.value; }).get();
            const current = input.val() || "*";
            select.val(known.includes(current) ? current : "__custom__");
            const sync = () => {
                if (select.val() !== "__custom__") input.val(select.val());
                input.toggle(select.val() === "__custom__");
                const p = input.val();
                $("#node-input-deadband-row").toggle(p !== "*" && p !== "");
            };
            select.on("change", sync);
            input.on("input change", sync);
            sync();
        },
        oneditsave: function () {
            if (!$("#node-input-property").val().trim()) $("#node-input-property").val("*");
        },
    });
</script>

<script type="text/markdown" data-help-name="power-genius-status">
Emits one Power Genius XL status property, or the whole status, when it changes.

Use one node per property you care about, for example `fwd`, `swr` or `state`. Choose *other* in the list to type
the name of any property the amplifier reports; leave it as *(all)* to get the whole object.

### Input

Any message emits the last known value, even if unchanged, and refreshes the status from the device.

### Output

: payload (number | string | object) : The value of the selected property, or the whole status object when `*` is selected.
: topic (string) : The property name, or `status` when `*` is selected.
: previous (number | string) : The previously emitted value (single property only; undefined for the first message).

### Properties

The `status` reply is a list of `key=value` pairs. Numeric values are emitted as numbers, everything else as text.

| Property | Meaning | Values / unit |
|---|---|---|
| `state` | Amplifier state | `STANDBY`, `IDLE` (operate, not transmitting), `TRANSMIT_A`, `TRANSMIT_B`; probably `FAULT` |
| `bandA`, `bandB` | Band of slice A / B | metres, e.g. `20` |
| `bsrcA`, `bsrcB` | Source of the band data | e.g. `FLEX` |
| `bsrcAutoA`, `bsrcAutoB` | Band source selected automatically | 1 = yes, 0 = no |
| `flexA`, `flexB` | FlexRadio nickname (FLEX mode) | text |
| `vac` | Mains voltage | V |
| `vdd` | Supply voltage | V; 0 when not transmitting |
| `id`, `peakid` | Drain current, and its peak | A; 0 when not transmitting |
| `fwd`, `peakfwd` | Forward power, and its peak | dBm; `fwd` is 30 (the meter minimum) when there is no RF, `peakfwd` keeps the last peak |
| `swr` | Return loss | dB (negative, e.g. -18; the FLEX `RL` meter); -60 when there is no RF |
| `temp` | PA temperature | °C |
| `hltemp` | Harmonic load temperature | °C |
| `cntfreq` | Frequency counted from the RF | kHz, e.g. 14098; 0 when there is no RF |
| `cat1freq`, `cat2freq` | Frequency from CAT port 1 / 2 (legacy radios with CAT or CI-V) | kHz; 0 in FLEX mode |
| `biasA`, `biasB` | Bias setting of input A / B, as `SOURCE_MODE` | e.g. `RADIO_AB`; others seen elsewhere: `AUTO_AAB`, `MANUAL_A` |
| `fanmode` | Fan mode | `STANDARD`, `CONTEST`, `BROADCAST` |
| `meffa` | MeFFA state | `OFF`, `ACTIVE`; may name a fault such as SWR, TEMP or CURRENT |
| `unkey` | Protection fault | 1 = active protection fault, 0 = normal operation |
| `antA` | Antenna selected on the antenna switch | Only on the 3-port antenna switch version; 0 on the SO2R version, which has no switch |
| `ants` | Antenna switch | 0 on the SO2R version (no antenna switch); values on the antenna switch version not seen yet |

Many status properties are only meaningful for some radio setups. With a FlexRadio (FLEX mode) the amplifier gets the
band and PTT from the radio over the network, and the properties for legacy radios using CAT or CI-V, such as
`cat1freq` and `cat2freq`, stay at 0. It is not known which of the remaining properties, for example `bsrcAutoA/B`,
belong to which mode, since the test amplifier is used with a FlexRadio.

Units are taken from the FLEX meter definitions in the API documentation and from observed values. There are two
hardware versions: SO2R, and one with a 3-port antenna switch. `antA` and `ants` were only seen on the SO2R version.

### Details

With *Only emit when the value changes* on, the first value after (re)connecting is always emitted.
The *Start delay* holds back all output for that many milliseconds after the flow is deployed, then emits
the latest known status. This gives downstream nodes such as dashboard widgets time to initialize.
The *Deadband* suppresses numeric changes smaller than the given amount, relative to the last emitted value,
which is useful for noisy values such as power and temperature.
