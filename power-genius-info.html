<script type="text/javascript">
    RED.nodes.registerType("power-genius-info", {
        category: "Power Genius",
        color: "#a6bbcf",
        defaults: {
            name: { value: "" },
            server: { type: "power-genius-server", required: true },
            property: { value: "*" },
            startDelay: { value: 1000, validate: function (v) { return v === "" || v === undefined || (!isNaN(v) && Number(v) >= 0); } },
        },
        inputs: 1,
        outputs: 1,
        icon: "bridge.svg",
        label: function () {
            if (this.name) return this.name;
            return this.property && this.property !== "*" ? "pg " + this.property : "pg info";
        },
        oneditprepare: function () {
            const select = $("#node-input-property-select");
            const input = $("#node-input-property");
            const known = select.find("option").map(function () { return this.value; }).get();
            const current = input.val() || "*";
            select.val(known.includes(current) ? current : "__custom__");
            const sync = () => {
                if (select.val() !== "__custom__") input.val(select.val());
                input.toggle(select.val() === "__custom__");
            };
            select.on("change", sync);
            sync();
        },
        oneditsave: function () {
            if (!$("#node-input-property").val().trim()) $("#node-input-property").val("*");
        },
    });
</script>

<script type="text/html" data-template-name="power-genius-info">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" />
    </div>
    <div class="form-row">
        <label for="node-input-server"><i class="fa fa-server"></i> Server</label>
        <input type="text" id="node-input-server" />
    </div>
    <div class="form-row">
        <label for="node-input-property-select"><i class="fa fa-filter"></i> Property</label>
        <select id="node-input-property-select" style="width:70%">
            <option value="*">(all, as an object)</option>
            <option value="name">name</option>
            <option value="nickname">nickname</option>
            <option value="firmware">firmware</option>
            <option value="authRequired">authRequired</option>
            <option value="ifconf">ifconf</option>
            <option value="catradioA">catradioA</option>
            <option value="catradioB">catradioB</option>
            <option value="flexradioA">flexradioA</option>
            <option value="flexradioB">flexradioB</option>
            <option value="__custom__">other (type the name)...</option>
        </select>
        <input type="text" id="node-input-property" style="display:none; margin-top:5px; width:70%; margin-left:105px" />
    </div>
    <div class="form-row">
        <label for="node-input-startDelay"><i class="fa fa-hourglass-start"></i> Start delay</label>
        <input type="number" id="node-input-startDelay" min="0" step="100" style="width:100px" />
        <span style="margin-left:5px">ms before the first output after deploy</span>
    </div>
</script>

<script type="text/markdown" data-help-name="power-genius-info">
Emits the Power Genius XL device information and configuration, or a single item of it.

### Input

Any message re-reads the info from the device and emits it.

### Output

: payload (string | number | boolean | object) : The selected item, or the whole info object when `*` is selected.
: topic (string) : The property name, or `info` when `*` is selected.

### Details

The info is collected with the read-only commands `setup read`, `ifconf read`, `catradio read=A|B` and
`flexradio read=A|B`; each reply is parsed as `key=value` pairs. Use `*` to get everything.

| Item | Meaning |
|---|---|
| `name` | Device name (the `nickname`, with `_` replaced by a space) |
| `nickname` | Device name as reported |
| `firmware` | Firmware version, from the banner the device sends on connect |
| `authRequired` | `true` when the device asked for authentication (only outside the local network; not supported yet) |
| `ledintens` | LED intensity |
| `txdelay` | TX delay |
| `inactivity-timeout` | Inactivity timeout, 0 = off |
| `authcode` | Authentication code for WAN access. Treat it as a secret: it is part of the whole info object |
| `ants`, `ant1name`..`ant3name` | Antenna switch setup: `ants` (0 on the SO2R version, which has no switch) and the names of antennas 1-3 (empty when not set) |
| `ifconf` | Object with the network configuration: `address`, `netmask`, `gateway`, `dhcp`, `dhcpstatus` and the active `address-status`, `netmask-status`, `gateway-status` |
| `catradioA`, `catradioB` | Objects with the CAT radio configuration of slice A / B, used with legacy radios (CAT or CI-V): `type`, `baud`, `parity`, `stopbits`, `civ`, `active` |
| `flexradioA`, `flexradioB` | Objects with the FlexRadio configuration of slice A / B: `serial`, `txant`, `ptt`, `active` |

The info is emitted once after the connection is established, and again after every reconnect.
The *Start delay* holds back output for that many milliseconds after the flow is deployed,
giving downstream nodes such as dashboard widgets time to initialize.
</script>
